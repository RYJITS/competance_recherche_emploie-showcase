services:
  recherche-emploi:
    build: ./app
    image: recherche-emploi:local
    container_name: recherche_emploi_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4780"
      BASE_PATH: /emploi
      CERVEAU_ROOT: /data
      RECHERCHE_EMPLOI_PROJECT: /data/Projet/Competance_Recherche_emploie
      CHROME_PATH: /usr/bin/chromium
      RECHERCHE_EMPLOI_AUTO_SCHEDULER: "1"
      RECHERCHE_EMPLOI_FORM_BROWSER_MODE: ${RECHERCHE_EMPLOI_FORM_BROWSER_MODE:-local_headless}
      RECHERCHE_EMPLOI_FORM_HEADLESS: ${RECHERCHE_EMPLOI_FORM_HEADLESS:-1}
    ports:
      - "127.0.0.1:4780:4780"
    volumes:
      - ./brain:/data
    networks:
      - nas_shared
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4780/emploi/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 20s

networks:
  nas_shared:
    external: true
    name: ${NAS_SHARED_NETWORK:-n8n_default}
