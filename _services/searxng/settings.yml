use_default_settings: true

general:
  debug: false
  instance_name: "Recherche Emploi SearXNG Local"

search:
  safe_search: 0
  default_lang: "fr"
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "127.0.0.1"
  base_url: false
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"
  secret_key: "local-dev-only-change-me"

ui:
  static_use_hash: true
